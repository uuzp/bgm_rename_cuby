[package]
name = "cuby"
version = "0.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fltk = { version = "1.5.22", default-features = false, features = [
    "fltk-bundled",
    "no-gdiplus",
    "no-pango",
    "single-threaded"
] }
miniserde = "0.1.45"
minreq = { version = "2.14.1", features = ["https-native"], default-features = false }
urlencoding = "2.1.3"
winreg = "0.55.0"

[build-dependencies]
embed-resource = "3.0.6"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
incremental = false
