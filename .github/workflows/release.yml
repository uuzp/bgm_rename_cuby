name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            bin_path: target/release/cuby.exe
            artifact: cuby-windows-x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            bin_path: target/release/cuby
            artifact: cuby-linux-x86_64
          - name: macos-x86_64
            os: macos-latest
            bin_path: target/release/cuby
            artifact: cuby-macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git pkg-config \
            cmake ninja-build \
            libssl-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev \
            libcairo2-dev libglib2.0-dev libpango1.0-dev

      - name: Build (release)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin_path }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for tag message)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euxo pipefail
          cp "dist/cuby-windows-x86_64/cuby.exe" "dist/cuby-windows-x86_64.exe"
          cp "dist/cuby-linux-x86_64/cuby" "dist/cuby-linux-x86_64"
          cp "dist/cuby-macos-x86_64/cuby" "dist/cuby-macos-x86_64"

      - name: Read annotated tag message
        id: tag
        shell: bash
        run: |
          body="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          if [ -n "${body}" ]; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cuby-windows-x86_64.exe
            dist/cuby-linux-x86_64
            dist/cuby-macos-x86_64
          body: ${{ steps.tag.outputs.body }}
          generate_release_notes: ${{ steps.tag.outputs.has_body != 'true' }}
